<title>Island Flower Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Une seule ambiance assumée : la mer des Antilles au petit matin (pas de thème clair/sombre).
     Écran plein : le décor (canvas) dessine ciel, mer et poissons ; les textes et boutons sont en HTML par-dessus. */
  :root {
    --nuit: #06243f;       /* fond derrière le jeu */
    --lagon: #19b5c9;      /* mer claire */
    --abysse: #0a3f73;     /* mer profonde */
    --soleil: #ffc53d;     /* accent : soleil, boutons importants */
    --corail: #ff6b4a;     /* erreur, mauvais poisson */
    --ecume: #fff8e8;      /* textes clairs, cartes */
    --bois: #6b3a17;       /* textes sur carte claire */
    --display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --texte: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--nuit); color: var(--ecume); font-family: var(--texte); overflow: hidden;
    padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  [hidden] { display: none !important; }
  /* le jeu remplit tout l'écran du téléphone ; sur un grand écran, il garde la largeur d'un téléphone */
  /* l'écran du jeu dans un cadre doré de téléphone, au milieu d'un fond flou (comme Island Kitchen Game) */
  #fond { position: fixed; inset: -40px; background: var(--nuit) center / cover no-repeat; filter: blur(18px) saturate(1.2) brightness(.85); }
  #phone { position: fixed; left: 0; top: 0; box-sizing: content-box; overflow: hidden; transform: translateZ(0);
    border: 9px solid transparent; border-radius: 44px;
    background: linear-gradient(var(--abysse), var(--abysse)) padding-box,
      linear-gradient(135deg, #fff3b8 0%, #e2b23a 22%, #a8740f 45%, #ffe08a 62%, #c8921c 80%, #fff1b0 100%) border-box;
    box-shadow: 0 0 0 1.5px #7a560e, 0 16px 40px rgba(0, 10, 30, .5), inset 0 0 0 1.5px rgba(255, 243, 196, .9); }
  #jeu { position: relative; height: 100%; width: 100%; overflow: hidden; border-radius: 35px; background: var(--abysse); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* barre du haut */
  .hud { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; display: flex; align-items: flex-start; gap: 2.2cqw; padding: 2.4cqw 3cqw; container-type: inline-size; }
  #jeu { container-type: inline-size; }
  .pastille { font-family: var(--display); font-weight: 600; font-size: 3.6cqw; padding: 1cqw 2.8cqw; border-radius: 99px; white-space: nowrap;
    background: rgba(255,248,232,.92); color: var(--bois); box-shadow: 0 .6cqw 0 rgba(0,0,0,.18); }
  .objectif { display: flex; align-items: center; gap: 1.4cqw; background: rgba(6,36,63,.55); color: var(--ecume); }
  .objectif canvas { position: static; width: 9cqw; height: 4.6cqw; }
  .hud > * { pointer-events: auto; }
  .appats { position: absolute; right: 2cqw; top: 16.5cqw; display: flex; flex-direction: column; gap: .9cqw; align-items: center; margin: 0; pointer-events: none !important; }
  .appats span { width: 3.7cqw; height: 3.7cqw; border-radius: 50%; background: var(--soleil); box-shadow: inset 0 -.6cqw 0 rgba(0,0,0,.2); }
  .appats span.perdu { background: rgba(255,255,255,.25); box-shadow: none; }
  .bouton-rond { font-family: var(--display); font-weight: 600; font-size: 3.4cqw; border: 0; border-radius: 99px; padding: 1cqw 2.6cqw; cursor: pointer;
    background: var(--corail); color: #fff; box-shadow: 0 .6cqw 0 #b33a1f; }
  .bouton-rond:focus-visible, .gros-bouton:focus-visible, .son:focus-visible { outline: .6cqw solid var(--soleil); outline-offset: .5cqw; }
  .chrono { position: absolute; left: 3cqw; right: 3cqw; top: 11.5cqw; height: 1.4cqw; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; }
  .chrono i { display: block; height: 100%; width: 100%; background: var(--soleil); border-radius: 99px; transform-origin: left; }
  .chrono.presse i { background: var(--corail); }

  /* messages flottants (« Vivaneau ! +25 ») */
  .bulle { position: absolute; left: 50%; transform: translate(-50%, 0); font-family: var(--display); font-weight: 700; font-size: 6cqw; white-space: nowrap;
    text-shadow: 0 .5cqw 0 rgba(0,0,0,.35); pointer-events: none; animation: monte 1.3s ease-out forwards; }
  .bulle.non { color: var(--corail); } .bulle.oui { color: var(--soleil); }
  @keyframes monte { 0% { opacity: 0; transform: translate(-50%, 4cqw) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 100% { opacity: 0; transform: translate(-50%, -10cqw) scale(1); } }
  .consigne { position: absolute; left: 0; right: 0; bottom: 6cqw; text-align: center; font-weight: 800; font-size: 3.8cqw; color: var(--ecume);
    text-shadow: 0 .4cqw .6cqw rgba(0,0,0,.5); pointer-events: none; }
  .combat { position: absolute; left: 50%; bottom: 14cqw; transform: translateX(-50%); font-family: var(--display); font-weight: 700; font-size: 5.6cqw;
    color: var(--soleil); text-shadow: 0 .5cqw 0 rgba(0,0,0,.4); pointer-events: none; animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: translateX(-50%) scale(1.1); } }

  /* fenêtres (accueil, niveau, fin de niveau) */
  .voile { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 6cqw; background: rgba(4,22,40,.45); }
  .carte { width: 100%; max-width: 100%; box-sizing: border-box; background: var(--ecume); color: var(--bois); border-radius: 5cqw; padding: 6cqw 6cqw 7cqw;
    text-align: center; box-shadow: 0 2cqw 0 rgba(0,0,0,.2), 0 3cqw 8cqw rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 3cqw; align-items: center; }
  .carte h1, .carte h2 { margin: 0; font-family: var(--display); font-weight: 700; text-wrap: balance; color: #0a5d8c; }
  .carte h1 { font-size: 9cqw; line-height: 1; } .carte h2 { font-size: 7cqw; line-height: 1.05; }
  .carte p { margin: 0; font-size: 4.1cqw; line-height: 1.4; }
  .voile.acc { background-color: #0d5d93; background-repeat: no-repeat; background-position: center top; background-size: 100% auto; align-items: flex-end; padding-bottom: 30cqw; }
  .voile.acc::after { content: ""; position: absolute; left: 0; right: 0; top: 118cqw; height: 36cqw; background: linear-gradient(to bottom, rgba(13,93,147,0), #0d5d93); pointer-events: none; }
  .voile.acc .carte { position: relative; z-index: 1; background: none; box-shadow: none; padding: 0; width: auto; }
  .voile.acc .petit { color: #fff; opacity: .9; text-shadow: 0 .3cqw 1cqw rgba(0,0,0,.5); }
  /* l'accueil, comme Island Kitchen Game : grand bouton « Jouer » vert qui pulse, ligne Niveau · Points, petit haut-parleur rond */
  .voile.acc .carte { display: flex; flex-direction: column; align-items: stretch; gap: 3cqw; width: 60cqw; }
  .voile.acc .gros-bouton { border-radius: 6cqw; font-size: 8cqw; font-weight: 800; padding: 3cqw 0; width: 100%;
    box-shadow: 0 1.2cqw 0 #1d7419, 0 1.9cqw 2.6cqw rgba(0,0,0,.25); text-shadow: 0 .35cqw 0 rgba(0,60,0,.4); animation: pulseJouer 2.2s ease-in-out infinite; }
  .voile.acc .gros-bouton:active { transform: translateY(.7cqw); box-shadow: 0 .5cqw 0 #1d7419; }
  .voile.acc .infos { text-align: center; color: #fff; font-size: 4cqw; font-weight: 800; text-shadow: 0 .26cqw 0 rgba(120,80,30,.55), 0 0 .7cqw rgba(120,80,30,.35); }
  @keyframes pulseJouer { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
  .affiche { width: 100%; max-height: 52cqh; object-fit: cover; border-radius: 3cqw; display: block; }
  .carte:has(.affiche) { padding: 3cqw 3cqw 5cqw; gap: 2cqw; } .carte:has(.affiche) h1 { font-size: 7cqw; }
  .petit { font-size: 3.4cqw !important; opacity: .8; }
  .gros-bouton { font-family: var(--display); font-weight: 700; font-size: 6.4cqw; border: 0; border-radius: 99px; padding: 2.6cqw 10cqw; cursor: pointer;
    background: #2fa52a; color: #fff; box-shadow: 0 1.2cqw 0 #1d7419; }
  .gros-bouton:active { transform: translateY(1cqw); box-shadow: 0 .2cqw 0 #1d7419; }
  .vitrine { display: flex; justify-content: center; gap: 2cqw; flex-wrap: wrap; }
  .vitrine figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: .6cqw; font-size: 3cqw; font-weight: 800; }
  .vitrine canvas { position: static; width: 17cqw; height: 9cqw; }
  .etapes { display: grid; grid-template-columns: auto 1fr; gap: 1.2cqw 3cqw; text-align: left; font-size: 3.5cqw; width: 100%; }
  .etapes b { font-family: var(--display); color: #0a5d8c; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .etoiles { font-size: 9cqw; letter-spacing: 1cqw; color: var(--soleil); text-shadow: 0 .5cqw 0 #c98a00; }
  .son { position: absolute; right: 3cqw; bottom: 3cqw; width: 10cqw; height: 10cqw; border-radius: 50%; border: .5cqw solid #f39a2b;
    background: #fff6df; font-size: 4.6cqw; line-height: 1; cursor: pointer; padding: 0; box-shadow: 0 .5cqw 0 #c2410c; }
  .son:active { transform: translateY(.4cqw); box-shadow: 0 .1cqw 0 #c2410c; }
  #jeu.sur-accueil .son { right: auto; left: 6.4cqw; bottom: 25cqw; }
  .debloque { display: flex; align-items: center; gap: 2.4cqw; background: rgba(255,210,58,.18); border-radius: 3cqw; padding: 2cqw 3cqw; }
  .debloque img { width: 12cqw; height: auto; flex: none; }
  @media (prefers-reduced-motion: reduce) { .bulle, .combat { animation-duration: .01s; } }
</style>
